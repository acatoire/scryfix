name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scryfix
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: scryfix/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test:coverage
      - run: pnpm run build
      - name: Generate status badges
        run: |
          mkdir -p dist/badges
          PCT=$(node -p "Math.round(require('./coverage/coverage-summary.json').total.lines.pct)")
          COLOR=red
          if [ "$PCT" -ge 80 ]; then COLOR=brightgreen; elif [ "$PCT" -ge 50 ]; then COLOR=yellow; fi
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${PCT}%\",\"color\":\"${COLOR}\"}" > dist/badges/coverage.json
          echo "{\"schemaVersion\":1,\"label\":\"last deploy\",\"message\":\"$(date -u +%Y-%m-%d)\",\"color\":\"blue\"}" > dist/badges/deployed-at.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: scryfix/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
